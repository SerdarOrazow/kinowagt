<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Kino Wagt</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    color-scheme: dark;
    --bg:#0b0b0d; --red:#e01f2d; --red-soft:#ff3b47;
    --text:#f2f2f4; --muted:#8b8b94;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#000;color:var(--text);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;}

  /* экран сообщений: заставка, отказы */
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 80% at 50% 0%, #1c1c22 0%, var(--bg) 60%);}
  .screen{width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:32px 26px;text-align:center;}
  .logo{width:96px;height:96px;border-radius:24px;
    background:linear-gradient(160deg,var(--red-soft),var(--red) 55%,#a3121c);
    box-shadow:0 14px 40px rgba(224,31,45,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:22px;}
  .logo b{font-size:22px;font-weight:800;letter-spacing:1.5px;line-height:1;color:#fff;}
  .logo span{font-size:13px;font-weight:600;line-height:1;margin-top:3px;
    color:rgba(255,255,255,.92);font-style:italic;}
  h1{font-size:17px;font-weight:600;margin-bottom:8px;}
  p{font-size:14px;line-height:1.6;color:var(--muted);max-width:340px;}
  .bar{width:132px;height:3px;border-radius:3px;margin-top:22px;
    background:rgba(255,255,255,.09);overflow:hidden;position:relative;}
  .bar i{position:absolute;inset:0;width:42%;border-radius:3px;
    background:linear-gradient(90deg,transparent,var(--red-soft),transparent);
    animation:slide 1.15s ease-in-out infinite;}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(260%)}}
  .btn{margin-top:24px;display:inline-block;padding:13px 26px;border-radius:12px;
    background:var(--red);color:#fff;font-size:15px;font-weight:600;text-decoration:none;
    box-shadow:0 8px 22px rgba(224,31,45,.32);}
  .code{font-size:11px;color:#5f5f68;margin-top:14px;}

  /* плеер занимает весь экран */
  #wrap{position:fixed;inset:0;background:#000;display:none;}
  #frame,#wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
</style>
</head>
<body>

<div id="stage">
  <div class="screen">
    <div class="logo"><b>KINO</b><span>wagt</span></div>
    <h1>Готовим плеер</h1>
    <p>Секунду, включаем видео…</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<div id="wrap"><div id="frame"></div></div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.requestFullscreen(); } catch (e) {}
    try { tg.setHeaderColor('#0b0b0d'); } catch (e) {}
    try { tg.setBackgroundColor('#000000'); } catch (e) {}
    try { tg.disableVerticalSwipes(); } catch (e) {}
  }

  var stage = document.getElementById('stage');
  var wrap  = document.getElementById('wrap');
  var CHANNEL = 'https://t.me/kino_wagt';

  function screen(title, text, code) {
    wrap.style.display = 'none';
    stage.style.display = 'flex';
    stage.innerHTML =
      '<div class="screen">' +
        '<div class="logo"><b>KINO</b><span>wagt</span></div>' +
        '<h1>' + title + '</h1><p>' + text + '</p>' +
        '<a class="btn" id="chan" href="' + CHANNEL + '">Открыть канал Kino Wagt</a>' +
        (code === undefined ? '' : '<div class="code">код ' + code + '</div>') +
      '</div>';

    var chan = document.getElementById('chan');
    if (chan) {
      chan.addEventListener('click', function (e) {
        if (tg && tg.openTelegramLink) {
          e.preventDefault();
          try { tg.openTelegramLink(CHANNEL); } catch (err) { location.href = CHANNEL; }
        }
      });
    }
  }

  // Идентификатор видео Telegram передаёт по-разному в разных версиях
  function param() {
    var found = '';
    try { if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) found = tg.initDataUnsafe.start_param; } catch (e) {}
    if (!found) { try {
      var q = new URLSearchParams(location.search);
      found = q.get('v') || q.get('tgWebAppStartParam') || q.get('startapp') || '';
    } catch (e) {} }
    if (!found && location.hash) { try {
      var h = new URLSearchParams(location.hash.replace(/^#/, ''));
      found = h.get('tgWebAppStartParam') || h.get('startapp') || '';
      if (!found) {
        var raw = h.get('tgWebAppData') || '';
        if (raw) found = new URLSearchParams(decodeURIComponent(raw)).get('start_param') || '';
      }
    } catch (e) {} }
    if (!found && tg && tg.initData) { try {
      found = new URLSearchParams(tg.initData).get('start_param') || '';
    } catch (e) {} }
    return found || '';
  }

  function decodeUrl(raw) {
    try {
      var s = raw.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return decodeURIComponent(escape(atob(s)));
    } catch (e) { return ''; }
  }

  var raw = (param() || '').trim();
  if (!raw) {
    screen('Видео не выбрано', 'Откройте плеер кнопкой «Смотреть» под постом.');
    return;
  }

  var videoId = '';
  if (/^[A-Za-z0-9_-]{11}$/.test(raw)) {
    videoId = raw;
  } else {
    var m = decodeUrl(raw).match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
    if (m) videoId = m[1];
  }
  if (!videoId) {
    screen('Не удалось открыть', 'Загляните в наш канал — там вся коллекция.');
    return;
  }

  function blocked(code) {
    screen('Смотрите в канале Kino Wagt',
           'Этот фильм открывается в нашем Telegram-канале.', code);
  }
  function missing(code) {
    screen('Фильм пока недоступен',
           'Загляните в наш канал — там вся коллекция.', code);
  }

  // ---------- обычный плеер YouTube ----------
  var started = false;

  function show() {
    if (started) return;
    started = true;
    stage.style.display = 'none';
    wrap.style.display = 'block';
  }

  function play() {
    show();
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);

    window.onYouTubeIframeAPIReady = function () {
      new YT.Player('frame', {
        videoId: videoId,
        playerVars: {
          autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1,
          iv_load_policy: 3, enablejsapi: 1, origin: location.origin
        },
        events: {
          onError: function (e) {
            var code = e && e.data;
            if (code === 100) missing(code); else blocked(code);
          }
        }
      });
    };

    // Если библиотека не поднялась — вставляем плеер напрямую
    setTimeout(function () {
      if (!window.YT || !window.YT.Player) {
        wrap.innerHTML =
          '<iframe allow="autoplay; encrypted-media; picture-in-picture; fullscreen" ' +
          'allowfullscreen referrerpolicy="origin-when-cross-origin" src="' +
          'https://www.youtube-nocookie.com/embed/' + videoId +
          '?autoplay=1&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3"></iframe>';
      }
    }, 8000);
  }

  // ---------- быстрая проверка до запуска ----------
  var decided = false;
  function decide(fn, arg) { if (!decided) { decided = true; fn(arg); } }

  setTimeout(function () { decide(play); }, 4000);

  fetch('https://www.youtube.com/oembed?format=json&url=' +
        encodeURIComponent('https://www.youtube.com/watch?v=' + videoId), {cache: 'no-store'})
    .then(function (r) {
      if (r.ok) return decide(play);
      if (r.status === 401 || r.status === 403) return decide(blocked, r.status);
      if (r.status === 404) return decide(missing, r.status);
      decide(play);
    })
    .catch(function () { decide(play); });
})();
</script>
</body>
</html>
